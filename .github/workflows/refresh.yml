name: Weekly event refresh

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, 14:17 UTC (morning in Seattle)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python refresh.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Commit the new snapshot
        run: |
          git config user.name "event-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/latest.json
          git diff --cached --quiet || git commit -m "Weekly event refresh"
          git push
